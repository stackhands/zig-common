name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-zig checks the tarball's minisign signature against the Zig
      # project's key.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      # The decimal digit table is pinned to Unicode 16.0.0, the unicodedata
      # of Python 3.14; the parity test skips its comparison under another.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - run: zig fmt --check build.zig build.zig.zon src tests
      - run: zig build test --summary all
      - name: parity with python's json and text calls
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found, skipping the parity test"
            exit 0
          fi
          zig build parity-probe
          python3 tests/test_json_pytext_parity.py
      - name: parity with python's filesystem and lock calls
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found, skipping the parity test"
            exit 0
          fi
          zig build fs-lock-parity-probe
          python3 tests/test_fs_lock_parity.py
      - name: parity with python's tempfile.gettempdir
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found, skipping the parity test"
            exit 0
          fi
          zig build tempdir-probe
          python3 tests/test_gettempdir_parity.py
      - name: parity with python 3.14 argparse calls
        run: |
          python3 -c "import sys; assert sys.version_info[:3] == (3, 14, 10), 'argparse parity is pinned to Python 3.14.10; found ' + sys.version.split()[0]"
          zig build argparse-parity-probe
          python3 tests/test_argparse_parity.py
      - name: no site names in the tree
        run: |
          ! git grep -nIiE 'snellius|surf\.nl|/gpfs/|/projects/0|rg\.terra|scratch-shared' -- . ':!.github/workflows/ci.yml'

  # Every tool's main built and tested against this commit of the library.
  # zig build --fork puts this checkout in place of the zig-common the tool
  # pins and leaves its build.zig.zon alone: eb-local's SBOM tests read it.
  tools:
    # A matrix boolean is rendered as true. develop named this job from
    # repo and ref, and the ruleset still requires
    # tools (stackhands/eb-keep-logs, zig). label is that second
    # component. A row that sets args keeps that text instead.
    name: tools (${{ matrix.repo }}${{ matrix.label && format(', {0}', matrix.label) || matrix.args && format(', {0}', matrix.args) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: stackhands/eb-keep-logs
            label: zig
            # tests/test_metrics.sh checks the metrics file with promtool, and
            # the schema tests need jsonschema, as in the tool's own CI.
            promtool: true
          - repo: stackhands/eb-local
            # Its command-line suite runs against the test artifact.
            args: -Dtest-ops=true
          - repo: stackhands/eb-staged-rebuild
          - repo: stackhands/eessi-arch-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: zig-common
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ matrix.repo }}
          ref: main
          path: tool
      # eb-local's command-line suite is Python, run with the version its own
      # CI uses.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: Install promtool 3.7.3 and jsonschema
        if: matrix.promtool
        run: |
          archive=prometheus-3.7.3.linux-amd64.tar.gz
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v3.7.3/${archive}"
          echo "fc9e5da126817438cf2820d9a7206c75e3122802ba8d20add3a6219a59ca6913  ${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          sudo install -m 0755 prometheus-3.7.3.linux-amd64/promtool /usr/local/bin/promtool
          pip install jsonschema
      - working-directory: tool
        env:
          ARGS: ${{ matrix.args }}
          # setup-zig points the local cache at the workspace root. The tools'
          # tests make their scratch directories under ./.zig-cache, as a
          # checkout of the tool alone has it, so the cache goes back there.
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/tool/.zig-cache
        run: zig build $ARGS test --summary all --fork="$GITHUB_WORKSPACE/zig-common"
