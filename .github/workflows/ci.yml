name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-zig checks the tarball's minisign signature against the Zig
      # project's key.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      # The decimal digit table is pinned to Unicode 16.0.0, the unicodedata
      # of Python 3.14; the parity test skips its comparison under another.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: zig fmt --check build.zig build.zig.zon src tests
      - run: zig build test --summary all
      - name: parity with python's json and text calls
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found, skipping the parity test"
            exit 0
          fi
          zig build parity-probe
          python3 tests/test_json_pytext_parity.py
      - name: parity with python's filesystem and lock calls
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found, skipping the parity test"
            exit 0
          fi
          zig build fs-lock-parity-probe
          python3 tests/test_fs_lock_parity.py
      - name: no site names in the tree
        run: |
          ! git grep -nIiE 'snellius|surf\.nl|/gpfs/|/projects/0|rg\.terra|scratch-shared' -- . ':!.github/workflows/ci.yml'

  # Every tool built and tested against this commit of the library, with its
  # pinned zig-common replaced by this checkout.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: stackhands/eb-keep-logs
            ref: zig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: zig-common
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: tool
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: point the tool at this checkout
        working-directory: tool
        run: |
          python3 - <<'PY'
          import re
          p = "build.zig.zon"
          s = open(p).read()
          s, n = re.subn(r"\.zig_common = \.\{[^}]*\}", '.zig_common = .{ .path = "../zig-common" }', s)
          assert n == 1, "no zig_common dependency"
          open(p, "w").write(s)
          PY
      - working-directory: tool
        run: zig build test --summary all
